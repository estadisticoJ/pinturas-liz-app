<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía rápida · Despacho · Pinturas Liz</title><style>/* Manual y guías dentro de la app (0.12.0): se leen en el celular y tienen «Volver a la app» siempre a mano */
:root{--bg:#F4F6FB;--fg:#0F1E3D;--muted:#4F5E7D;--line:#D3DCEC;--head:#0E3A8C;--acento:#C8202A;--sol:#F6C21A;--surface:#FFFFFF;--tabla:#F4F6FB;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0A1430;--fg:#EEF2FB;--muted:#A8B5D6;--line:#2A3C70;--head:#8DB6FF;--acento:#FF8A80;--surface:#122148;--tabla:#1B2D5E;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
.volver-app{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#0E3A8C;color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));box-shadow:0 2px 8px rgba(0,0,0,.2)}
.volver-app a{color:#fff;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 14px}
.volver-app a.principal{background:#C8202A;border-color:#C8202A}
.volver-app span{margin-left:auto;font-size:13px;opacity:.85}
main,.contenido{max-width:860px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1{color:var(--head);font-size:1.7rem;border-bottom:4px solid var(--sol);padding-bottom:6px}
h2{color:var(--head);font-size:1.3rem;margin-top:2rem;border-bottom:1px solid var(--line);padding-bottom:4px}
h3{color:var(--acento);font-size:1.08rem;margin-top:1.4rem}
a{color:var(--head)}
table{border-collapse:collapse;width:100%;font-size:.9rem;display:block;overflow-x:auto}
th{background:#0E3A8C;color:#fff;text-align:left;padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr:nth-child(even) td{background:var(--tabla)}
img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin:6px 8px 6px 0;vertical-align:top}
p:has(> img + img) img{max-width:calc(50% - 10px)}
pre,code{font-size:.85rem} pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
hr{border:0;height:4px;background:linear-gradient(90deg,#C8202A 0 20%,#F07A1C 20% 40%,#F6C21A 40% 60%,#2E9D45 60% 80%,#1559C2 80% 100%);margin:22px 0}
header#title-block-header{display:none}
.guia img{display:block;width:100%;max-width:760px;margin:0 auto;border-radius:10px}
/* Anula el estilo por defecto de pandoc (ancho fijo y márgenes) para que la barra ocupe todo el ancho */
html body{max-width:none!important;margin:0!important;padding:0 0 48px!important;background:var(--bg)!important;color:var(--fg)!important;font-size:16px!important}
body > :not(.volver-app):not(.contenido){max-width:860px;margin-left:auto!important;margin-right:auto!important;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body > table{padding:0!important;width:calc(100% - 32px);max-width:828px}</style></head><body>

<div class="contenido guia"><img src="guia-despacho.png" alt="Guía rápida de Despacho"></div></body></html>
